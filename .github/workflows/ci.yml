name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MQ_TEST_CONTROL_DATABASE_URL: postgresql://control:ci-control@localhost:5432/control
      MQ_TEST_RUNTIME_DATABASE_URL: postgresql://runtime:ci-runtime@localhost:5432/runtime
      MQ_TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-admin@localhost:5432/postgres
      MQ_TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-admin@localhost:5432/postgres
      POSTGRES_CONTROL_PASSWORD: ci-control
      POSTGRES_RUNTIME_PASSWORD: ci-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install locked Python dependencies
        run: uv sync --locked --all-extras
      - name: Install media renderer and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          ffmpeg -version
          ffprobe -version
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/control/go.mod
          cache-dependency-path: apps/control/go.sum
      - name: Initialize disposable platform databases
        env:
          PLATFORM_BOOTSTRAP_ADMIN_URL: postgresql://postgres:ci-admin@localhost:5432/postgres
          CONTROL_DATABASE_URL: ${{ env.MQ_TEST_CONTROL_DATABASE_URL }}
          RUNTIME_DATABASE_URL: ${{ env.MQ_TEST_RUNTIME_DATABASE_URL }}
        run: uv run --locked python tools/migrate/platform_migrate.py
      - name: Lint
        run: |
          cd apps/runtime
          uv run --locked ruff check agent_runtime tests
      - name: Architecture boundaries
        run: uv run --locked python tools/dev/check_architecture.py
      - name: Test
        working-directory: apps/runtime
        run: uv run --locked pytest
      - name: Go race tests and vet
        working-directory: apps/control
        run: |
          go test -race ./...
          go vet ./...
      - name: Platform contract artifacts
        run: |
          uv run --locked python tools/migrate/export_platform_contracts.py
          git diff --exit-code -- packages/contracts
          uv run --locked python tools/migrate/export_control_openapi.py
          git diff --exit-code -- docs/api/control-v2.json

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deployment check dependencies
        run: pip install python-dotenv pydantic-settings pyyaml
      - name: Validate Compose configuration
        run: docker compose -f infra/docker/docker-compose.yml config --quiet
      - name: Offline deployment checks
        run: python tools/dev/check_deployment.py
      - name: Build image
        run: |
          docker build -f apps/runtime/Dockerfile -t ai-content-platform-runtime:ci .
          docker build -f apps/control/Dockerfile -t ai-content-platform-control-plane:ci apps/control

  audit:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Export locked production dependencies
        run: |
          mkdir -p .tmp
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file .tmp/locked-requirements.txt
      - name: Dependency audit
        run: >
          uv tool run --from pip-audit pip-audit -r .tmp/locked-requirements.txt --strict

  release-gate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: [lint-test, docker, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release checklist and observability contracts
        run: |
          test -s docs/operations/release-checklist.md
          test -s infra/monitoring/prometheus.yml
          test -s infra/monitoring/alerts.yml
          grep -q 'request_id/job_id' docs/operations/release-checklist.md
