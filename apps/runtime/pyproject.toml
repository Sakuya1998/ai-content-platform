[project]
name = "novel-agent"
version = "2.0.0"
description = "General AI content platform Runtime"
readme = {text = "Agent Runtime for Novel Agent Platform", content-type = "text/plain"}
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "cryptography>=46.0",
    "fastapi>=0.140",
    "python-multipart>=0.0.20",
    "uvicorn>=0.32",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "psycopg[binary,pool]>=3.2",
    "rocketmq-python-client>=5.1.2",
    "boto3>=1.43.110",
    "httpx>=0.27",
    "jsonschema>=4.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]
migration = [
    "chromadb>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_runtime"]

# ---------------- Ruff ----------------
[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [".venv", "data", "output", "memory"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # FastAPI 依赖注入风格需要在参数中调用函数
]

[tool.ruff.lint.isort]
known-first-party = ["agent_runtime"]

# ---------------- Pytest ----------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
