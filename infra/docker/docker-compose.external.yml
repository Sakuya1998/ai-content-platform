name: ai-content-platform-external
services:
  runtime-dispatch: &external-messaging
    image: ${RUNTIME_IMAGE:-ai-content-platform-runtime:local}
    restart: unless-stopped
    env_file: [../../apps/runtime/.env.external]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: { disable: true }
    command: [python, -m, agent_runtime.entrypoints.messaging, dispatch]
  runtime-control:
    <<: *external-messaging
    command: [python, -m, agent_runtime.entrypoints.messaging, control]
  runtime-relay:
    <<: *external-messaging
    command: [python, -m, agent_runtime.entrypoints.messaging, relay]
  memory-dispatch:
    <<: *external-messaging
    command: [python, -m, agent_runtime.entrypoints.messaging, memory]
  memory-scheduler:
    <<: *external-messaging
    command: [python, -m, agent_runtime.entrypoints.messaging, memory-scheduler]
  runtime-worker:
    <<: *external-messaging
    profiles: [workers]
    command: [python, -m, agent_runtime.entrypoints.messaging, worker]
  memory-worker:
    <<: *external-messaging
    profiles: [workers]
    command: [python, -m, agent_runtime.entrypoints.messaging, memory-worker]
  migrate:
    image: ${RUNTIME_IMAGE:-ai-content-platform-runtime:local}
    build:
      context: ../..
      dockerfile: apps/runtime/Dockerfile
    restart: "no"
    env_file:
      - ../../apps/control/.env.external
      - ../../apps/runtime/.env.external
    command: ["python", "tools/migrate/platform_migrate.py"]
  control-plane:
    image: ${CONTROL_PLANE_IMAGE:-ai-content-platform-control-plane:local}
    build:
      context: ../..
      dockerfile: apps/control/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../apps/control/.env.external
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${CONTROL_PLANE_PORT:-8080}:8080"
  runtime:
    image: ${RUNTIME_IMAGE:-ai-content-platform-runtime:local}
    build:
      context: ../..
      dockerfile: apps/runtime/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../apps/runtime/.env.external
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${RUNTIME_PORT:-8000}:8000"
    command: ["uvicorn", "agent_runtime.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
