apiVersion: apps/v1
kind: Deployment
metadata: {name: control-plane, namespace: novel-agent}
spec:
  replicas: 1
  selector: {matchLabels: {app: control-plane}}
  template:
    metadata: {labels: {app: control-plane}}
    spec:
      containers: [{name: control-plane, image: novel-agent-control-plane:local, envFrom: [{configMapRef: {name: novel-agent-control}}, {secretRef: {name: novel-agent-control}}], ports: [{containerPort: 8080}], readinessProbe: {httpGet: {path: /readyz, port: 8080}, initialDelaySeconds: 3, periodSeconds: 10}, livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10, periodSeconds: 20}}]
---
apiVersion: v1
kind: Service
metadata: {name: control-plane, namespace: novel-agent}
spec: {selector: {app: control-plane}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: runtime, namespace: novel-agent}
spec:
  replicas: 1
  selector: {matchLabels: {app: runtime}}
  template:
    metadata: {labels: {app: runtime}}
    spec:
      containers: [{name: runtime, image: novel-agent-runtime:local, envFrom: [{configMapRef: {name: novel-agent-runtime}}, {secretRef: {name: novel-agent-runtime}}], ports: [{containerPort: 8000}], readinessProbe: {httpGet: {path: /readyz, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}, livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 10, periodSeconds: 20}}]
---
apiVersion: v1
kind: Service
metadata: {name: runtime, namespace: novel-agent}
spec: {selector: {app: runtime}, ports: [{port: 8000, targetPort: 8000}]}
