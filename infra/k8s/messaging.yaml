apiVersion: apps/v1
kind: Deployment
metadata: {name: runtime-dispatch, namespace: novel-agent}
spec:
  replicas: 1
  selector: {matchLabels: {app: runtime-dispatch}}
  template:
    metadata: {labels: {app: runtime-dispatch}}
    spec:
      containers:
        - name: dispatch
          image: novel-agent-runtime:local
          command: [python, -m, agent_runtime.entrypoints.messaging, dispatch]
          envFrom: [{configMapRef: {name: novel-agent-runtime}}, {secretRef: {name: novel-agent-runtime}}]
---
