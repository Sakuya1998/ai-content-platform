apiVersion: apps/v1
kind: Deployment
metadata: {name: runtime-worker, namespace: novel-agent}
spec:
  # Configure RUNTIME_WORKER_HANDLER, then scale this deployment.
  replicas: 0
  selector: {matchLabels: {app: runtime-worker}}
  template:
    metadata: {labels: {app: runtime-worker}}
    spec:
      containers:
        - name: worker
          image: novel-agent-runtime:local
          command: [python, -m, agent_runtime.entrypoints.messaging, worker]
          envFrom: [{configMapRef: {name: novel-agent-runtime}}, {secretRef: {name: novel-agent-runtime}}]
          env:
            - name: RUNTIME_WORKER_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
---
