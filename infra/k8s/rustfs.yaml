apiVersion: apps/v1
kind: Deployment
metadata: {name: rustfs, namespace: novel-agent}
spec:
  replicas: 1
  selector: {matchLabels: {app: rustfs}}
  template:
    metadata: {labels: {app: rustfs}}
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          args: [--console-address, ":9001", /data]
          envFrom: [{secretRef: {name: novel-agent-platform}}]
          ports: [{containerPort: 9000}, {containerPort: 9001}]
---
apiVersion: v1
kind: Service
metadata: {name: rustfs, namespace: novel-agent}
spec: {selector: {app: rustfs}, ports: [{name: api, port: 9000}, {name: console, port: 9001}]}
